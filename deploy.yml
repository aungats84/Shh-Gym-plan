name: Deploy to GitHub Pages

# Runs every time you push to the main branch, and can also be
# started by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Lets the workflow publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, finish the newer one and cancel the older.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check for code problems
        run: npm run lint

      - name: Check types
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build the site
        env:
          # The repository name, so the site loads from /<repo-name>/.
          # There are no secrets to configure - this version stores
          # everything in the browser and talks to no server.
          VITE_BASE_PATH: ${{ github.event.repository.name }}
        run: npm run build

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Package the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
